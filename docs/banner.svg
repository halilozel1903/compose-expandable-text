<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-expandable-text: expandable read more text for Jetpack Compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1847"/>
      <stop offset="1" stop-color="#3A2F7A"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5D52A7"/>
      <stop offset="1" stop-color="#E07A66"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B0820" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="1180" cy="40" r="260" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="90" cy="560" r="220" fill="#FFFFFF" opacity="0.04"/>

  <!-- Title -->
  <text x="72" y="148" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="37" font-weight="700" fill="#FFFFFF">compose-expandable-text</text>
  <text x="74" y="200" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="23" fill="#D6D0FF">Read more text for Jetpack Compose,</text>
  <text x="74" y="234" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="23" fill="#D6D0FF">cut at a word with an inline "… more"</text>

  <!-- Feature chips -->
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="72" y="272" width="212" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.10" stroke="#C9BFFF" stroke-opacity="0.45"/>
    <text x="178" y="297">Word boundary cut</text>
    <rect x="296" y="272" width="190" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.10" stroke="#C9BFFF" stroke-opacity="0.45"/>
    <text x="391" y="297">Animated expand</text>
    <rect x="72" y="322" width="250" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.10" stroke="#C9BFFF" stroke-opacity="0.45"/>
    <text x="197" y="347">Links, @mentions, #tags</text>
    <rect x="334" y="322" width="136" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.10" stroke="#C9BFFF" stroke-opacity="0.45"/>
    <text x="402" y="347">Fade style</text>
    <rect x="72" y="372" width="170" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.10" stroke="#C9BFFF" stroke-opacity="0.45"/>
    <text x="157" y="397">Lazy list ready</text>
    <rect x="254" y="372" width="160" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.10" stroke="#C9BFFF" stroke-opacity="0.45"/>
    <text x="334" y="397">Accessibility</text>
  </g>
  <text x="74" y="452" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#B8AEF5">Saveable state · RTL · Phones and tablets</text>

  <g transform="translate(58 14) scale(0.95)">
  <!-- Phone with a feed -->
  <g filter="url(#shadow)">
    <rect x="640" y="56" width="250" height="470" rx="34" fill="#F4F1FF"/>
  </g>
  <rect x="650" y="66" width="230" height="450" rx="26" fill="#FCF8FF"/>
  <rect x="735" y="76" width="60" height="7" rx="3.5" fill="#D8D2EC"/>

  <!-- Post 1: collapsed with inline more -->
  <rect x="662" y="98" width="206" height="128" rx="16" fill="#EFEAFB"/>
  <circle cx="684" cy="120" r="12" fill="url(#avatar)"/>
  <rect x="704" y="112" width="80" height="8" rx="4" fill="#2A2738"/>
  <rect x="704" y="124" width="54" height="6" rx="3" fill="#A29DB3"/>
  <rect x="674" y="146" width="182" height="8" rx="4" fill="#5A566A"/>
  <rect x="674" y="164" width="168" height="8" rx="4" fill="#5A566A"/>
  <rect x="674" y="182" width="98" height="8" rx="4" fill="#5A566A"/>
  <text x="776" y="190" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5D52A7">… more</text>
  <rect x="674" y="204" width="24" height="7" rx="3.5" fill="#C4BED6"/>
  <rect x="708" y="204" width="24" height="7" rx="3.5" fill="#C4BED6"/>

  <!-- Post 2: expanded with highlighted tokens -->
  <rect x="662" y="236" width="206" height="172" rx="16" fill="#EFEAFB"/>
  <circle cx="684" cy="258" r="12" fill="url(#avatar)"/>
  <rect x="704" y="250" width="70" height="8" rx="4" fill="#2A2738"/>
  <rect x="704" y="262" width="48" height="6" rx="3" fill="#A29DB3"/>
  <rect x="674" y="284" width="110" height="8" rx="4" fill="#5A566A"/>
  <rect x="790" y="284" width="66" height="8" rx="4" fill="#5D52A7"/>
  <rect x="674" y="302" width="176" height="8" rx="4" fill="#5A566A"/>
  <rect x="674" y="320" width="182" height="8" rx="4" fill="#5A566A"/>
  <rect x="674" y="338" width="60" height="8" rx="4" fill="#5A566A"/>
  <rect x="740" y="338" width="110" height="8" rx="4" fill="#5D52A7"/>
  <rect x="674" y="356" width="52" height="8" rx="4" fill="#E07A66"/>
  <rect x="732" y="356" width="44" height="8" rx="4" fill="#E07A66"/>
  <text x="782" y="364" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5D52A7">less</text>
  <rect x="674" y="384" width="24" height="7" rx="3.5" fill="#C4BED6"/>
  <rect x="708" y="384" width="24" height="7" rx="3.5" fill="#C4BED6"/>

  <!-- Post 3: short, no label -->
  <rect x="662" y="418" width="206" height="84" rx="16" fill="#EFEAFB"/>
  <circle cx="684" cy="440" r="12" fill="url(#avatar)"/>
  <rect x="704" y="432" width="76" height="8" rx="4" fill="#2A2738"/>
  <rect x="704" y="444" width="50" height="6" rx="3" fill="#A29DB3"/>
  <rect x="674" y="466" width="150" height="8" rx="4" fill="#5A566A"/>
  <rect x="674" y="484" width="24" height="7" rx="3.5" fill="#C4BED6"/>

  <!-- Product card with fade -->
  <g filter="url(#shadow)">
    <rect x="930" y="120" width="290" height="330" rx="26" fill="#FFFFFF"/>
  </g>
  <rect x="946" y="136" width="258" height="112" rx="18" fill="#E5DEFF"/>
  <path d="M1059 176 v-6 a16 16 0 0 1 32 0 v6 h12 l-4 50 h-48 l-4 -50 z" fill="#5D52A7" fill-opacity="0.85"/>
  <rect x="1067" y="176" width="16" height="4" rx="2" fill="#E5DEFF"/>
  <rect x="946" y="264" width="150" height="10" rx="5" fill="#2A2738"/>
  <rect x="946" y="282" width="62" height="10" rx="5" fill="#5D52A7"/>
  <rect x="946" y="310" width="250" height="8" rx="4" fill="#5A566A"/>
  <rect x="946" y="328" width="238" height="8" rx="4" fill="#5A566A"/>
  <rect x="946" y="346" width="250" height="8" rx="4" fill="#5A566A"/>
  <rect x="946" y="364" width="226" height="8" rx="4" fill="#5A566A"/>
  <rect x="940" y="338" width="264" height="40" fill="url(#fade)"/>
  <text x="946" y="404" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5D52A7">Read more</text>
  <path d="M1040 398 l6 6 l6 -6" fill="none" stroke="#5D52A7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="946" y="420" width="258" height="14" rx="7" fill="#F0ECF4"/>

  <!-- Tap highlight around the inline label -->
  <rect x="770" y="173" width="66" height="24" rx="12" fill="none" stroke="#E07A66" stroke-width="2.5"/>
  </g>
</svg>
